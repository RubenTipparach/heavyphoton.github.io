<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heavy Photon</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XJD57XPSH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XJD57XPSH1');
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }

      #underwater-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      /* Navigation */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        background: linear-gradient(180deg, rgba(0, 26, 51, 0.8) 0%, transparent 100%);
      }

      .nav-logo {
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: white;
        text-decoration: none;
        cursor: pointer;
        transition: text-shadow 0.3s ease;
      }

      .nav-logo:hover {
        text-shadow: 0 0 20px rgba(136, 204, 255, 0.8);
      }

      .nav-links {
        display: flex;
        gap: 2rem;
      }

      /* Mobile menu button */
      .nav-menu-btn {
        display: none;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        color: white;
        cursor: pointer;
        font-size: 1.2rem;
        transition: all 0.3s ease;
      }

      .nav-menu-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .nav-link {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: all 0.3s ease;
        padding: 0.5rem 1rem;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }

      .nav-link:hover,
      .nav-link.active {
        color: white;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        text-shadow: 0 0 20px rgba(136, 204, 255, 0.8);
      }

      /* Content Panels */
      .panel {
        position: fixed;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .panel.active {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }

      .panel-content {
        background: rgba(0, 20, 40, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 2.5rem;
        max-height: 70vh;
        overflow-y: auto;
      }

      .panel-content::-webkit-scrollbar {
        width: 6px;
      }

      .panel-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      .panel-content::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }

      /* Home Panel - Center */
      #panel-home {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none; /* Allow clicks to pass through to orbs */
      }

      #panel-home.active {
        pointer-events: none; /* Keep it click-through even when active */
      }

      #panel-home .panel-content {
        background: transparent;
        backdrop-filter: none;
        border: none;
        padding: 0;
        pointer-events: none; /* Ensure content is also click-through */
      }

      .home-title {
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: 200;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 1rem;
        background: linear-gradient(180deg, #ffffff 0%, #88ccff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        animation: fadeInUp 1s ease-out;
      }

      .home-subtitle {
        font-size: clamp(1rem, 3vw, 1.5rem);
        font-weight: 200;
        letter-spacing: 0.15em;
        opacity: 0.8;
        margin-bottom: 2rem;
        animation: fadeInUp 1s ease-out 0.2s both;
      }

      .home-hint {
        font-size: 0.9rem;
        opacity: 0.5;
        letter-spacing: 0.1em;
        animation: fadeInUp 1s ease-out 0.4s both;
      }

      .social-badges {
        position: fixed;
        bottom: 2rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        z-index: 50;
        animation: fadeInUp 1s ease-out 0.6s both;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      .social-badges.hidden {
        opacity: 0 !important;
        transform: translateY(20px) !important;
        pointer-events: none;
      }

      .social-badge {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        transition: all 0.3s ease;
        pointer-events: auto;
      }

      .social-badge:hover {
        background: rgba(136, 204, 255, 0.2);
        border-color: rgba(136, 204, 255, 0.5);
        color: white;
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(136, 204, 255, 0.3);
      }

      .social-badge svg {
        width: 20px;
        height: 20px;
      }

      /* About Panel - Left */
      #panel-about {
        top: 50%;
        left: 5%;
        transform: translateY(-50%);
        max-width: 450px;
      }

      /* Games Panel - Right */
      #panel-games {
        top: 50%;
        right: 5%;
        transform: translateY(-50%);
        max-width: 500px;
      }

      /* Projects Panel - Left */
      #panel-projects {
        top: 50%;
        left: 5%;
        transform: translateY(-50%);
        max-width: 450px;
      }

      /* Contact Panel - Bottom Center */
      #panel-contact {
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        max-width: 600px;
        width: 90%;
      }

      .panel-title {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        background: linear-gradient(180deg, #ffffff 0%, #88ccff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .panel-text {
        font-size: 1rem;
        line-height: 1.8;
        opacity: 0.9;
        margin-bottom: 1.5rem;
      }

      .panel-section {
        margin-bottom: 2rem;
      }

      .panel-section h3 {
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        color: #88ccff;
        margin-bottom: 0.8rem;
      }

      /* Project Cards */
      .projects-grid {
        display: grid;
        gap: 1rem;
      }

      .project-card {
        display: flex;
        gap: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1rem;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }

      .project-card:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(136, 204, 255, 0.3);
        transform: translateX(5px);
      }

      .project-thumb {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .project-info {
        flex: 1;
        min-width: 0;
      }

      .view-all-card {
        display: block;
        background: rgba(136, 204, 255, 0.1);
        border-color: rgba(136, 204, 255, 0.3);
        text-align: center;
      }

      .view-all-card:hover {
        background: rgba(136, 204, 255, 0.2);
        border-color: rgba(136, 204, 255, 0.5);
      }

      .view-all-card h4 {
        color: #88ccff;
      }

      .project-card h4 {
        font-size: 1rem;
        font-weight: 400;
        margin-bottom: 0.3rem;
      }

      .project-card .tags {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .project-card .tag {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        background: rgba(136, 204, 255, 0.2);
        border-radius: 10px;
        color: #88ccff;
      }

      .project-card p {
        font-size: 0.85rem;
        opacity: 0.7;
        line-height: 1.5;
      }

      .featured-project {
        flex-direction: column;
        background: rgba(136, 204, 255, 0.08);
        border-color: rgba(136, 204, 255, 0.25);
      }

      .featured-project:hover {
        background: rgba(136, 204, 255, 0.15);
        border-color: rgba(136, 204, 255, 0.4);
      }

      .featured-project h4 {
        font-size: 1.3rem;
        color: #88ccff;
        margin-bottom: 0.5rem;
      }

      .learn-more {
        display: inline-block;
        margin-top: 0.8rem;
        color: #88ccff;
        font-size: 0.9rem;
        transition: transform 0.3s ease;
      }

      .featured-project:hover .learn-more {
        transform: translateX(5px);
      }

      /* Contact Form */
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 0.8rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: white;
        font-size: 0.9rem;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: rgba(136, 204, 255, 0.5);
        background: rgba(255, 255, 255, 0.08);
      }

      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .form-group textarea {
        min-height: 100px;
        resize: vertical;
      }

      .submit-btn {
        padding: 0.8rem 2rem;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: white;
        background: linear-gradient(135deg, rgba(0, 150, 200, 0.6), rgba(0, 100, 150, 0.6));
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .submit-btn:hover {
        background: linear-gradient(135deg, rgba(0, 180, 230, 0.8), rgba(0, 130, 180, 0.8));
        box-shadow: 0 0 20px rgba(136, 204, 255, 0.4);
      }

      .contact-info h3 {
        font-size: 1rem;
        font-weight: 400;
        color: #88ccff;
        margin-bottom: 0.5rem;
      }

      .contact-info p {
        font-size: 0.9rem;
        opacity: 0.8;
        margin-bottom: 1.5rem;
      }

      .contact-info a {
        color: #88ccff;
        text-decoration: none;
      }

      .contact-info a:hover {
        color: white;
      }

      .social-links {
        display: flex;
        gap: 0.8rem;
      }

      .social-link {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .social-link:hover {
        background: rgba(136, 204, 255, 0.2);
        border-color: rgba(136, 204, 255, 0.4);
        transform: translateY(-2px);
      }

      .social-link svg {
        width: 18px;
        height: 18px;
        color: rgba(255, 255, 255, 0.7);
      }

      .social-link:hover svg {
        color: white;
      }

      /* Audio Toggle */
      #audio-toggle {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        width: 45px;
        height: 45px;
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(0, 30, 60, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 200;
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      #audio-toggle:hover {
        background: rgba(0, 50, 100, 0.8);
        border-color: rgba(255, 255, 255, 0.4);
      }

      #audio-toggle.active {
        background: rgba(0, 100, 150, 0.7);
        border-color: rgba(136, 204, 255, 0.6);
        box-shadow: 0 0 20px rgba(136, 204, 255, 0.3);
      }

      /* Scene Transition Overlay */
      .scene-transition {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 1000;
        transition: opacity 0.5s ease;
      }

      .scene-transition.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* Astronautics UI */
      .astronautics-ui {
        position: fixed;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }

      .astronautics-ui.active {
        opacity: 1;
        /* Keep pointer-events: none on container, children handle their own */
      }

      .astronautics-ui.active .seed-display,
      .astronautics-ui.active .randomize-btn {
        pointer-events: auto;
      }

      .seed-display {
        position: fixed;
        bottom: 1.5rem;
        left: 1.5rem;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.4);
        font-family: monospace;
        letter-spacing: 0.05em;
      }

      .randomize-btn {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.6rem 1.5rem;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(100, 50, 150, 0.4);
        border: 1px solid rgba(150, 100, 200, 0.4);
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .randomize-btn:hover {
        background: rgba(130, 80, 180, 0.6);
        border-color: rgba(180, 130, 230, 0.6);
        box-shadow: 0 0 20px rgba(150, 100, 200, 0.4);
      }

      .planet-info {
        position: fixed;
        top: 50%;
        right: 5%;
        transform: translateY(-50%);
        max-width: 300px;
        background: rgba(20, 10, 40, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(150, 100, 200, 0.3);
        border-radius: 16px;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .planet-info.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .planet-info h3 {
        font-size: 1.5rem;
        font-weight: 300;
        color: #c8a8ff;
        margin-bottom: 1rem;
      }

      .planet-stat {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }

      .planet-stat-label {
        color: rgba(255, 255, 255, 0.6);
      }

      .planet-stat-value {
        color: #c8a8ff;
      }

      .zoom-out-btn {
        margin-top: 1rem;
        width: 100%;
        padding: 0.6rem;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(150, 100, 200, 0.3);
        border: 1px solid rgba(150, 100, 200, 0.4);
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .zoom-out-btn:hover {
        background: rgba(150, 100, 200, 0.5);
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mission text */
      .mission-text {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }

      /* Values list */
      .values-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .values-list li {
        position: relative;
        padding-left: 1.2rem;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .values-list li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.5em;
        width: 6px;
        height: 6px;
        background: #88ccff;
        border-radius: 50%;
      }

      /* Skills list */
      .skills-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .skill-tag {
        background: rgba(78, 205, 196, 0.2);
        border: 1px solid rgba(78, 205, 196, 0.4);
        color: #4ecdc4;
        padding: 0.4rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .nav {
          padding: 1rem;
        }

        .nav-menu-btn {
          display: block;
          z-index: 101;
        }

        .nav-links {
          position: absolute;
          top: 100%;
          right: 1rem;
          flex-direction: column;
          background: rgba(0, 20, 40, 0.95);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 8px;
          padding: 0.5rem;
          gap: 0.25rem;
          opacity: 0;
          visibility: hidden;
          transform: translateY(-10px);
          transition: all 0.3s ease;
        }

        .nav-links.open {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .nav-link {
          font-size: 0.85rem;
          padding: 0.75rem 1.25rem;
          width: 100%;
          text-align: left;
        }

        #panel-about,
        #panel-games,
        #panel-projects {
          left: 5%;
          right: 5%;
          max-width: none;
          transform: translateY(-50%);
        }

        #panel-games {
          right: 5%;
          left: 5%;
        }

        .astronautics-ui .seed-display {
          font-size: 0.65rem;
        }

        .astronautics-ui .randomize-btn {
          font-size: 0.75rem;
          padding: 0.5rem 1rem;
        }

        .planet-info {
          right: 3%;
          left: 3%;
          max-width: none;
        }

        #panel-home {
          width: 90%;
          left: 5%;
          transform: translate(0, -50%);
        }

        .steam-widget iframe {
          width: 100%;
          height: 190px;
        }

        .contact-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .panel-content {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="underwater-canvas"></div>

    <!-- Navigation -->
    <nav class="nav">
      <a class="nav-logo nav-link" data-location="home">Heavy Photon</a>
      <button class="nav-menu-btn" id="nav-menu-btn" aria-label="Toggle menu">&#9776;</button>
      <div class="nav-links" id="nav-links">
        <a class="nav-link" data-location="about">About</a>
        <a class="nav-link" data-location="games">Games</a>
        <a class="nav-link" data-location="projects">Projects</a>
        <a class="nav-link" data-location="astronautics">Astronautics</a>
        <a class="nav-link" data-location="contact">Contact</a>
      </div>
    </nav>

    <!-- Home Panel -->
    <div id="panel-home" class="panel active">
      <div class="panel-content">
        <h1 class="home-title">Heavy Photon</h1>
        <!-- <p class="home-subtitle">Dive into the depths of creativity</p> -->
        <div class="steam-widget" style="margin-top: 2rem; pointer-events: auto; animation: fadeInUp 1s ease-out 0.6s both;">
        </div>
      </div>
    </div>

    <!-- About Panel -->
    <div id="panel-about" class="panel">
      <div class="panel-content">
        <h2 class="panel-title">About</h2>

        <div class="panel-section">
          <h3>Our Story</h3>
          <div id="about-bio">
            <!-- Rendered from config -->
          </div>
        </div>

        <div class="panel-section">
          <h3>Mission</h3>
          <div id="about-mission">
            <!-- Rendered from config -->
          </div>
        </div>

        <div class="panel-section">
          <h3>Values</h3>
          <ul class="values-list" id="about-values">
            <!-- Rendered from config -->
          </ul>
        </div>

        <div class="panel-section">
          <h3>Skills</h3>
          <div class="skills-list" id="about-skills">
            <!-- Rendered from config -->
          </div>
        </div>

      </div>
    </div>

    <!-- Games Panel -->
    <div id="panel-games" class="panel">
      <div class="panel-content">
        <h2 class="panel-title">Games</h2>

        <div class="projects-grid" id="games-grid">
          <!-- Games are dynamically rendered from config -->
        </div>
      </div>
    </div>

    <!-- Projects Panel -->
    <div id="panel-projects" class="panel">
      <div class="panel-content">
        <h2 class="panel-title">Ongoing Projects</h2>

        <div class="projects-grid" id="projects-grid">
          <!-- Rendered from config -->
        </div>
      </div>
    </div>

    <!-- Contact Panel -->
    <div id="panel-contact" class="panel">
      <div class="panel-content">
        <h2 class="panel-title">Contact</h2>

        <div class="contact-info">
